# Hermes Dev Studio — Staging Nginx Configuration (HTTP Testing)

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream fastapi_staging {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        client_max_body_size 50m;

        location /api/health {
            proxy_pass http://fastapi_staging/api/health;
        }

        location /ws/ {
            proxy_pass http://fastapi_staging/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://fastapi_staging;
            proxy_set_header Host $host;
        }

        location / {
            root /var/www/hermes/client/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}